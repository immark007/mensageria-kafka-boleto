server:
  port: 8282
spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:boleto
    driver-class-name: org.h2.Driver
    username: admin
    password: 123
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
      path: /swagger-ui.html
      enabled: true
